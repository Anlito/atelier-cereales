<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier du distributeur de céréales</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/atelier.css">
</head>
<body>
<div class="ecran-exercice">

  <header class="entete">
    <button type="button" class="btn-parcours"><span data-icone="retour" data-epaisseur="2.8"></span>Parcours</button>
    <div class="entete-titre">
      <span class="pastille-exercice">Exercice</span>
      <span class="titre-exercice"></span>
    </div>
    <div class="entete-equipe">
      <span data-icone="equipe" data-epaisseur="2.4"></span>
      <span class="equipe-noms"></span><span class="equipe-classe"></span>
    </div>
  </header>

  <div class="zone-consigne">
    <section class="consigne" aria-label="Consigne">
      <div class="consigne-libelle"><span data-icone="crayon"></span>Consigne</div>
      <div class="consigne-texte"></div>
      <p class="consigne-courte"></p>
      <button type="button" class="consigne-bascule" aria-expanded="true"><span data-icone="chevronHaut" data-epaisseur="2.8"></span>Réduire</button>
    </section>
    <div class="bulle" role="dialog" aria-label="Définition" hidden>
      <div class="bulle-entete">
        <span data-icone="livre" data-epaisseur="2.4"></span>
        <strong class="bulle-mot"></strong>
        <button type="button" class="bulle-fermer" aria-label="Fermer">×</button>
      </div>
      <p class="bulle-definition"></p>
    </div>
  </div>

  <main class="principal">
    <section class="editeur" aria-label="Éditeur de blocs">
      <div class="editeur-blockly"></div>
      <div class="editeur-etiquettes" aria-hidden="true"></div>
      <div class="editeur-outils">
        <div class="groupe-outils">
          <button type="button" class="btn-annuler" aria-label="Annuler" title="Annuler (Ctrl+Z)"><span data-icone="annuler"></span></button>
          <button type="button" class="btn-retablir" aria-label="Rétablir" title="Rétablir (Ctrl+Y)"><span data-icone="retablir"></span></button>
        </div>
        <div class="groupe-outils">
          <button type="button" class="btn-zoom-moins" aria-label="Dézoomer">−</button>
          <span class="zoom-valeur">100 %</span>
          <button type="button" class="btn-zoom-plus" aria-label="Zoomer">+</button>
        </div>
        <div class="groupe-outils">
          <button type="button" class="btn-recentrer" aria-label="Recentrer" title="Recentrer"><span data-icone="recentrer"></span></button>
        </div>
      </div>
    </section>

    <section class="simulateur" aria-label="Simulateur">
      <div class="simu-titre">
        <span>Simulateur</span>
        <span class="simu-note" aria-live="polite"></span>
        <div class="chrono" aria-label="Temps de la simulation"><span data-icone="horloge" data-epaisseur="2.4"></span><span class="chrono-valeur">00:00</span></div>
      </div>
      <div class="simu-carte"></div>
      <div class="simu-milieu">
        <div class="simu-composants"></div>
        <div class="simu-distributeur"></div>
      </div>
      <div class="simu-commandes">
        <button type="button" class="btn-lancer" aria-pressed="false"><span data-icone="lecture"></span>Lancer</button>
        <button type="button" class="btn-commande btn-pause" disabled><span data-icone="pause" data-epaisseur="3.4"></span>Pause</button>
        <button type="button" class="btn-commande btn-recommencer" disabled><span data-icone="recommencer" data-epaisseur="2.8"></span>Recommencer</button>
        <div class="vitesse" role="group" aria-label="Vitesse">
          <button type="button" class="btn-vitesse" data-vitesse="1" aria-pressed="true">×1</button>
          <button type="button" class="btn-vitesse" data-vitesse="2" aria-pressed="false">×2</button>
          <button type="button" class="btn-vitesse" data-vitesse="5" aria-pressed="false">×5</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="aide">
    <button type="button" class="btn-aide" data-bientot="La fiche « À savoir » arrive bientôt."><span data-icone="info"></span>À savoir</button>
    <button type="button" class="btn-aide" data-bientot="Les indices arrivent bientôt."><span data-icone="ampoule"></span>Indice<span class="compteur">0/3</span></button>
    <button type="button" class="btn-aide" data-bientot="Le lexique complet arrive bientôt. Clique sur un mot souligné de la consigne."><span data-icone="livre"></span>Lexique</button>
    <button type="button" class="btn-aide btn-enregistrer" data-bientot="L’enregistrement arrive bientôt. Ton programme est gardé dans ce navigateur."><span data-icone="disquette" data-epaisseur="2.4"></span>Enregistrer</button>
    <button type="button" class="btn-verifier"><span data-icone="coche"></span>Vérifier mon programme</button>
  </footer>

  <div class="panneau-verification" role="status" hidden></div>
  <div class="message-bref" role="status" hidden></div>

  <dialog class="dialogue-parcours" aria-label="Choisir un exercice">
    <div class="dialogue-entete">
      <strong>Choisir un exercice</strong>
      <button type="button" class="btn-fermer-parcours" aria-label="Fermer">×</button>
    </div>
    <p class="dialogue-note">Version d’essai : tous les exercices sont ouverts. Le parcours avec déblocage arrive à l’étape 5.</p>
    <div class="liste-exercices"></div>
  </dialog>
</div>

<!-- Bibliothèques (copiées dans le dépôt : aucun CDN) -->
<script src="vendor/blockly/blockly_compressed.js"></script>
<script src="vendor/blockly/fr.js"></script>
<!-- Moteur (le même que celui des tests Node) -->
<script src="js/moteur/programme.js"></script>
<script src="js/moteur/simulation.js"></script>
<script src="js/moteur/validation.js"></script>
<script src="js/moteur/catalogue.js"></script>
<!-- Données modifiables par le professeur -->
<script src="exercices/parametres.js"></script>
<script src="exercices/01.js"></script>
<script src="exercices/02.js"></script>
<script src="exercices/03.js"></script>
<script src="exercices/04.js"></script>
<script src="exercices/05.js"></script>
<script src="exercices/06.js"></script>
<script src="exercices/07.js"></script>
<script src="exercices/08.js"></script>
<script src="exercices/09.js"></script>
<script src="exercices/10.js"></script>
<script src="exercices/11.js"></script>
<script src="exercices/12.js"></script>
<script src="exercices/13A.js"></script>
<script src="exercices/13B.js"></script>
<script src="donnees/lexique.js"></script>
<!-- Interface -->
<script src="js/icones.js"></script>
<script src="js/blocs.js"></script>
<script src="js/editeur.js"></script>
<script src="js/simulateur-vue.js"></script>
<script src="js/ecran-exercice.js"></script>
<script>Atelier.demarrerEcranExercice();</script>
</body>
</html>
